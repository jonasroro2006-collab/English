<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#58cc02">
<meta name="description" content="English Jonas — apprendre l'anglais du niveau débutant au niveau supérieur, hors ligne.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="style.css">
<title>English Jonas</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
    <div class="brand"><span class="brand-mark">JR</span><span>English <span>Jonas</span></span></div>
    <div class="top-stats">
      <span title="Série">🔥 <b id="streakTop">0</b></span>
      <span title="XP">⚡ <b id="xpTop">0</b></span>
      <span title="Vies">❤️ <b id="heartsTop">5</b></span>
    </div>
  </header>

  <aside id="sidebar" class="sidebar">
    <div class="side-head"><div class="brand"><span class="brand-mark">JR</span><span>English <span>Jonas</span></span></div><button class="icon-btn" id="closeMenu" aria-label="Fermer">×</button></div>
    <nav>
      <button data-screen="home" class="nav-item active">🏠 <span>Accueil</span></button>
      <button data-screen="learn" class="nav-item">📚 <span>Apprendre</span></button>
      <button data-screen="review" class="nav-item">🔁 <span>Révision</span></button>
      <button data-screen="practice" class="nav-item">🎯 <span>Entraînement</span></button>
      <button data-screen="placement" class="nav-item">📝 <span>Test de niveau</span></button>
      <button data-screen="stats" class="nav-item">📊 <span>Progression</span></button>
      <button data-screen="achievements" class="nav-item">🏆 <span>Récompenses</span></button>
      <button data-screen="dictionary" class="nav-item">📖 <span>Dictionnaire</span></button>
      <button data-screen="settings" class="nav-item">⚙️ <span>Paramètres</span></button>
    </nav>
    <div class="offline-card"><span>●</span> Mode hors ligne actif<br><small>Tes données restent sur cet appareil.</small></div>
  </aside>
  <div id="overlay" class="overlay"></div>

  <main id="main"></main>

  <div id="toast" class="toast"></div>
</div>
<noscript>English Jonas a besoin de JavaScript pour fonctionner.</noscript>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>

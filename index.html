<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#58cc02">
<meta name="description" content="English Jonas — apprendre l'anglais du niveau débutant au niveau supérieur, hors ligne.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="style.css">
<title>English Jonas</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
    <div class="brand"><span class="brand-mark">JR</span><span>English <span>Jonas</span></span></div>
    <button class="btn small install-btn" id="installTop" hidden>📲 Installer</button>
    <div class="top-stats">
      <span title="Série">🔥 <b id="streakTop">0</b></span>
      <span title="XP">⚡ <b id="xpTop">0</b></span>
      <span title="Vies">❤️ <b id="heartsTop">5</b></span>
    </div>
  </header>

  <aside id="sidebar" class="sidebar">
    <div class="side-head"><div class="brand"><span class="brand-mark">JR</span><span>English <span>Jonas</span></span></div><button class="icon-btn" id="closeMenu" aria-label="Fermer">×</button></div>
    <nav>
      <button data-screen="home" class="nav-item active">🏠 <span>Accueil</span></button>
      <button data-screen="learn" class="nav-item">📚 <span>Apprendre</span></button>
      <button data-screen="review" class="nav-item">🔁 <span>Révision</span></button>
      <button data-screen="practice" class="nav-item">🎯 <span>Entraînement</span></button>
      <button data-screen="placement" class="nav-item">📝 <span>Test de niveau</span></button>
      <button data-screen="stats" class="nav-item">📊 <span>Progression</span></button>
      <button data-screen="achievements" class="nav-item">🏆 <span>Récompenses</span></button>
      <button data-screen="dictionary" class="nav-item">📖 <span>Dictionnaire</span></button>
      <button data-screen="settings" class="nav-item">⚙️ <span>Paramètres</span></button>
    </nav>
    <button class="btn full install-btn" id="installSide" style="margin:18px 0 0" hidden>📲 Télécharger l'application</button>
    <div class="offline-card"><span>●</span> Mode hors ligne actif<br><small>Tes données restent sur cet appareil.</small></div>
  </aside>
  <div id="overlay" class="overlay"></div>

  <main id="main"></main>

  <div id="toast" class="toast"></div>
</div>
<noscript>English Jonas a besoin de JavaScript pour fonctionner.</noscript>
<script>
(function(){
  if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("service-worker.js").catch(function(){})})}
  var deferred=null;
  var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  function show(v){document.querySelectorAll('.install-btn').forEach(function(b){b.hidden=!v})}
  function toast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},6000)}
  if(!standalone){show(true)}
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;show(true)});
  window.addEventListener('appinstalled',function(){deferred=null;show(false);toast('Application installée ✅')});
  document.addEventListener('click',function(e){
    var b=e.target.closest('.install-btn');if(!b)return;
    if(deferred){deferred.prompt();deferred.userChoice.finally(function(){deferred=null})}
    else if(ios){toast("Sur iPhone : touche Partager (⬆️) puis « Sur l'écran d'accueil »")}
    else{toast("Ouvre le menu du navigateur (⋮) puis « Installer l'application » ou « Ajouter à l'écran d'accueil »")}
  });
})();
</script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
